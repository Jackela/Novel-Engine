services:
  novel-engine:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: production
      SECURITY_SECRET_KEY: ${SECURITY_SECRET_KEY:?Set SECURITY_SECRET_KEY}
      SECURITY_CORS_ORIGINS: ${SECURITY_CORS_ORIGINS:-https://app.example.com}
      DB_URL: sqlite:///./data/novel-engine.sqlite3
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - novel-engine-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  novel-engine-data:
