name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENVIRONMENT: testing
      SECURITY_SECRET_KEY: test-secret-key-for-ci-contracts-1234567890

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-factor 2
          pnpm config set fetch-retry-mintimeout 1000
          pnpm config set fetch-retry-maxtimeout 60000
          pnpm install --frozen-lockfile
      - name: Validate dependency security
        # Production deps only: the full audit (including dev tooling) runs in
        # the scheduled dependency-audit workflow so new upstream advisories
        # cannot flap open PRs whose lockfile predates them.
        run: pnpm audit --audit-level high --prod
      - name: Validate SSOT, hygiene, and OpenSpec
        run: |
          pnpm --dir server gates
          pnpm spec:validate
      - name: Validate server architecture, types, lint, and tests
        run: |
          pnpm --dir server arch
          pnpm --dir server type-check
          pnpm --dir server lint
          pnpm --dir server test
      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm lint
          pnpm format:check
          pnpm type-check
          pnpm test:unit
          pnpm build
      - name: Check generated API types drift
        working-directory: frontend
        run: pnpm check:api-types
      - name: Validate React static diagnostics
        working-directory: frontend
        run: |
          react_doctor_report="${RUNNER_TEMP}/react-doctor.json"
          pnpm exec react-doctor --json > "${react_doctor_report}"
          node - "${react_doctor_report}" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const summary = report.summary ?? report.projects?.[0]?.summary;
          if (!summary) {
            console.error("React Doctor report did not include a summary.");
            process.exit(1);
          }
          if (summary.totalDiagnosticCount !== 0) {
            console.error(
              `React Doctor found ${summary.totalDiagnosticCount} diagnostics.`,
            );
            const diagnostics = report.diagnostics?.length
              ? report.diagnostics
              : (report.projects ?? []).flatMap(
                  (project) => project.diagnostics ?? [],
                );
            console.error(JSON.stringify(diagnostics, null, 2));
            process.exit(1);
          }
          console.log(
            `React Doctor clean: score ${summary.score} (${summary.scoreLabel})`,
          );
          NODE
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # #274/#277: the Studio workflow runs against the TS backend through the
      # emitted CLI (`serve`) serving frontend/dist — the production runtime.
      - name: Build the TS server for the SPA workflow
        run: pnpm --dir server build
      - name: Validate Studio workflow against the TS backend
        working-directory: frontend
        run: pnpm test:e2e:ts
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-browser-diagnostics
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-factor 2
          pnpm config set fetch-retry-mintimeout 1000
          pnpm config set fetch-retry-maxtimeout 60000
          pnpm install --frozen-lockfile --filter novel-engine-server...
      - name: Validate workspace gates
        run: pnpm --dir server gates
      - name: Validate server architecture
        run: pnpm --dir server arch
      - name: Validate server types and lint
        run: |
          pnpm --dir server type-check
          pnpm --dir server lint
      - name: Test server
        run: pnpm --dir server test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: docker build -t novel-engine:ci .
      - name: Verify fresh install, persistence, restart, and deep link
        run: |
          set -euo pipefail
          trap 'docker rm -f novel-engine >/dev/null 2>&1 || true; docker volume rm novel-engine-ci >/dev/null 2>&1 || true' EXIT
          docker volume create novel-engine-ci
          docker run -d --name novel-engine -p 8000:8000 \
            -e SECURITY_SECRET_KEY=container-test-secret-key-1234567890 \
            -e SECURITY_CORS_ORIGINS=https://app.example.com \
            -v novel-engine-ci:/app/data \
            novel-engine:ci
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health/ready && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/ready || { echo '::group::container logs'; docker logs novel-engine; exit 1; }
          node --input-type=module - <<'NODE'
          const [identity, html] = await Promise.all([
            fetch("http://127.0.0.1:8000/version").then((response) => response.json()),
            fetch("http://127.0.0.1:8000/projects/demo/history").then((response) => response.text()),
          ]);
          if (!html.includes(`<title>${identity.name}</title>`)) {
            throw new Error("container SPA title does not match /version product identity");
          }
          NODE
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"username":"owner","password":"container-owner-password"}' \
            http://127.0.0.1:8000/api/setup
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"owner","password":"container-owner-password"}' \
            http://127.0.0.1:8000/api/session/login
          docker restart novel-engine
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health/ready && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/ready || { echo '::group::container logs after restart'; docker logs novel-engine; exit 1; }
          curl -fsS -b cookies.txt http://127.0.0.1:8000/api/session | grep -q '"kind":"owner"'
          docker exec -w /app/server novel-engine node -e "const db=require('better-sqlite3')('/app/data/novel-engine.sqlite3');const check=db.prepare('PRAGMA quick_check').get();if(check.quick_check!=='ok'){throw new Error('sqlite quick_check failed: '+JSON.stringify(check));}const count=db.prepare('SELECT count(*) AS n FROM __drizzle_migrations').get();if(count.n<1){throw new Error('drizzle migrations table empty');}console.log('sqlite ok, '+count.n+' migrations applied');"
