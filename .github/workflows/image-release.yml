# ghcr multi-arch image publish pipeline (#628, v0.8.0 release chain).
#
# Each architecture builds and pushes on its native runner (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm) by digest; the `merge` job assembles
# the final manifest list with `docker buildx imagetools create`. No QEMU:
# better-sqlite3 ships N-API prebuilds, so neither stage compiles native code.
#
# Version SSOT: the image ref (pushed tag, or the workflow_dispatch input) must
# be a semver tag whose core (major.minor.patch, "v" prefix optional) equals
# server/package.json — the docker tag and the /version endpoint are never
# allowed to drift apart. Prerelease refs (e.g. v0.8.0-rc.1) publish only their
# exact tag: no `latest`, no major.minor tag.
#
# Owner runbook (first publish only; agent does not execute these):
# 1. The first ghcr package may default to private. Repo → Packages →
#    novel-engine → Package settings → Danger Zone → change visibility to
#    public.
# 2. Verify anonymous access from an outside machine, without `docker login`:
#    `docker pull ghcr.io/jackela/novel-engine:0.7.0` followed by
#    `docker buildx imagetools inspect ghcr.io/jackela/novel-engine:0.7.0`
#    (must list linux/amd64 + linux/arm64). Published image tags carry no
#    v prefix: dispatch input `v0.8.0-rc.1` publishes `0.8.0-rc.1`.
# 3. Before an official v-tag, validate the whole chain via workflow_dispatch
#    (input `image_tag`, e.g. `v0.8.0-rc.1`); the semver core must already
#    match server/package.json, so the release PR bumps the version first.
#    Dispatch only from the default branch: the assertion reads
#    server/package.json from whichever ref the run is dispatched on, so
#    dispatching from a feature branch could publish unmerged code under a
#    release tag name.

name: Image release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Image tag to publish, e.g. v0.8.0-rc.1 (v prefix optional). Its
          semver core must match server/package.json version. Dispatch only
          from the default branch: the version assertion reads
          server/package.json from the ref the run is dispatched on.
        required: true
        type: string

permissions:
  contents: read

# A publish must never be cancelled mid-run; a second trigger for the same ref
# queues behind it instead.
concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve ref and assert version SSOT
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Resolve image ref and assert version SSOT
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";

          const ref =
            process.env.EVENT_NAME === "workflow_dispatch"
              ? process.env.DISPATCH_IMAGE_TAG
              : process.env.GITHUB_REF_NAME;
          const pkg = JSON.parse(
            fs.readFileSync("server/package.json", "utf8"),
          );

          // Optional "v" prefix plus optional semver prerelease suffix.
          // Build metadata (+...) is rejected outright: docker tags cannot
          // contain "+", and silently stripping it would publish a tag that
          // no longer matches the ref the operator asked for.
          const match = /^v?(\d+\.\d+\.\d+)(-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(
            ref ?? "",
          );
          if (!match) {
            throw new Error(
              `image ref "${ref}" is not a semver tag (optional v prefix, optional -prerelease suffix); refusing to publish`,
            );
          }
          const core = match[1];
          const suffix = match[2] ?? "";
          if (core !== pkg.version) {
            throw new Error(
              `version SSOT drift: image ref "${ref}" (semver core ${core}) does not match server/package.json "${pkg.version}"; merge the release PR that bumps the package version before publishing this ref`,
            );
          }

          // A prerelease suffix marks the ref as unstable: it publishes only
          // its exact tag (no `latest`, no major.minor tag).
          const isStable = suffix === "";
          const version = `${core}${suffix}`;
          const majorMinor = core.split(".").slice(0, 2).join(".");
          // ghcr requires lowercase repository names; GITHUB_REPOSITORY may be
          // mixed case (Jackela/Novel-Engine).
          const imageName = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;

          // Tag lines for docker/metadata-action. Equivalent to
          // type=semver pattern={{version}} + pattern={{major}}.{{minor}} +
          // latest-only-for-stable, but derived from the normalized ref so the
          // workflow_dispatch input takes exactly the same path as a pushed tag.
          const tags = [`type=raw,value=${version}`];
          if (isStable) {
            tags.push(`type=raw,value=${majorMinor}`, "type=raw,value=latest");
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `image_name=${imageName}`,
              `version=${version}`,
              "tags<<TAG_LINES",
              ...tags,
              "TAG_LINES",
              "",
            ].join("\n"),
          );
          console.log(
            `image=${imageName} version=${version} stable=${isStable} tags=[${tags.join(", ")}]`,
          );
          NODE

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ${{ needs.prepare.outputs.image_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          # `latest` comes solely from the prepare job's stable-ref decision.
          flavor: latest=false
          tags: ${{ needs.prepare.outputs.tags }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # v7 injects --attest type=provenance,mode=max by default on public
          # repos, which would wrap each platform result in an OCI index and
          # surface unknown/unknown entries in the merged manifest list.
          provenance: false
          # Per-platform scopes keep the two runners from evicting each
          # other's cache blobs under the shared gha cache namespace.
          cache-from: type=gha,scope=image-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=image-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest list
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ${{ needs.prepare.outputs.image_name }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: latest=false
          tags: ${{ needs.prepare.outputs.tags }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "$GHCR_IMAGE@sha256:%s " *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE}:${{ needs.prepare.outputs.version }}"
