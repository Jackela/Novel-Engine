packages:
  - frontend
  - server
  - tools/api-types
allowBuilds:
  '@fission-ai/openspec': true
  '@swc/core': true
  better-sqlite3: set this to true or false
  esbuild: true
  # better-sqlite3 deliberately stays out of this list: although its tarball
  # ships prebuilt N-API binaries, a binding.gyp inside the package makes an
  # allow-listed install run node-gyp rebuild, which fails without a Python
  # toolchain (as the Docker image build did). lib/binding.js loads the
  # prebuilds directly; no build step is wanted.

overrides:
  # Legacy drizzle-kit chain (drizzle-kit > @esbuild-kit/esm-loader >
  # @esbuild-kit/core-utils > esbuild 0.18.20) carries GHSA-67mh-4wv8-2f99.
  # core-utils only calls esbuild transform/transformSync, which are stable
  # across 0.25.x; align it with drizzle-kit's own esbuild ^0.25.4 (#462).
  "@esbuild-kit/core-utils>esbuild": ">=0.25.12 <0.26"
  # @redocly/openapi-core pins js-yaml at exactly 4.3.1; force the patched
  # 4.x line (GHSA-2883-xcg3-v3hh) (#493).
  js-yaml: ">=4.3.2 <5"
  brace-expansion: ">=5.0.9 <6"
  fast-uri: ">=3.1.5 <5"
  nanoid: ">=3.3.18 <4"
  postcss: ">=8.5.18 <9"
  undici: ">=7.29.0 <8"
