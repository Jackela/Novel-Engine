<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="__PRODUCT_NAME__ is a self-hosted, single-author writing IDE."
    />
    <meta name="theme-color" content="#d9eee9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#122b28" media="(prefers-color-scheme: dark)" />
    <title>__PRODUCT_NAME__</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      var theme = null;
      try {
        theme = localStorage.getItem("novel_engine_theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch { /* storage unavailable: system path, CSS decides */ }
    </script>
    <script>
      // Pre-paint language resolution — mirrors src/app/i18n/language.ts
      // (stored choice wins, then zh* browser tags, then English default) so
      // assistive tech reads the right `lang` before React mounts. Keep the
      // two implementations in sync.
      var language = null;
      var candidates = [];
      var i;
      try {
        language = localStorage.getItem("novel_engine_language");
      } catch { /* storage unavailable: detection below decides */ }
      if (language !== "en" && language !== "zh") {
        language = "en";
        candidates =
          (typeof navigator !== "undefined" && navigator.languages) ||
          (typeof navigator !== "undefined" && navigator.language ? [navigator.language] : []);
        for (i = 0; i < candidates.length; i++) {
          if (String(candidates[i]).split("-")[0].toLowerCase() === "zh") {
            language = "zh";
            break;
          }
        }
      }
      document.documentElement.lang = language;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
  </html>
